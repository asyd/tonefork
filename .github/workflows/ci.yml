name: CI

# Build and test on every push to main (and on pull requests).
# On main, the binary is also published as a rolling pre-release named "latest",
# replaced at each push (not a versioned release).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Debian 12, amd64)
    runs-on: ubuntu-latest
    # Debian 12 (glibc 2.36): the binary runs on Debian 12+, Ubuntu 22.04+, etc.
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir dist
          strip target/release/tonefork
          cp target/release/tonefork LICENSE README.md dist/
          tar czf tonefork-linux-amd64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: tonefork-linux-amd64
          path: tonefork-linux-amd64.tar.gz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the "latest" build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One update at a time, never cancelled half-way.
    concurrency:
      group: latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tonefork-linux-amd64

      - name: Checksum
        run: sha256sum tonefork-linux-amd64.tar.gz > tonefork-linux-amd64.tar.gz.sha256

      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build (main)" \
            --notes "Automatic build of the latest commit on main (${GITHUB_SHA::7}), replaced at every push. Not a versioned release. Linux amd64, built on Debian 12 (glibc 2.36); needs the ALSA runtime library (libasound2 on Debian/Ubuntu)." \
            tonefork-linux-amd64.tar.gz tonefork-linux-amd64.tar.gz.sha256
